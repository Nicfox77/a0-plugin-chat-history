name: chat_history
title: Chat History
description: >-
  Queryable chat history for every conversation (main chat, subagents,
  background jobs) in an embedded Postgres database (pg0, no extra
  containers): full-text and semantic search, context inspection, and a
  live replica that never loses messages to compaction. Embeddings use the
  embedding model already configured in model settings. Optional Continuous
  Mode turns the primary chat into one infinite rolling conversation with
  compaction summaries archived to a durable deck.
version: 0.3.0
always_enabled: false
settings_sections:
  - agent
per_project_config: false
per_agent_config: false
